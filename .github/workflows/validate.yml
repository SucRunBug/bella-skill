name: Validate collection
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_collection.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure media test tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: python -m unittest discover -s skills/media/bella-product-promo/tests -p 'test_*.py' -v
      - run: node --check skills/media/bella-product-promo/assets/browser-starter/render.mjs
      - run: python -m unittest discover -s skills/media/bella-music-mv/tests -p 'test_*.py' -v
      - run: node --test skills/media/bella-music-mv/tests/test_engine.mjs
      - run: python -m unittest discover -s skills/english/bella-speaking-coach/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s skills/media/yanmai-video-reading/tests -p 'test_*.py' -v
      - run: python skills/game-3d/tripo-3d/scripts/selftest.py
      - run: python skills/game-3d/tripo-3d/scripts/test_setup_blender.py
