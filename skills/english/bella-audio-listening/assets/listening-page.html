<body>
<header><div class="brand"><span class="brand-mark" aria-hidden="true">♪</span>听读手记</div><div class="header-actions"><button class="ghost" id="export">导出备份</button><button class="ghost" id="import">恢复备份</button><input type="file" accept=".json,application/json" id="backup-file" hidden></div></header>
<div class="layout"><main>
<section class="hero"><div class="eyebrow">A LITTLE EVERY DAY · 每次听懂一点</div><h1 id="lesson-title"></h1><p class="subtitle" id="lesson-subtitle"></p><div class="hero-meta"><span id="duration"></span><span id="sentence-count"></span><span>原声听读</span></div></section>
<div class="toolbar"><div class="tabs" role="tablist" aria-label="学习内容"><button class="tab" id="reading-tab" role="tab" aria-selected="true" aria-controls="reading">逐句听读</button><button class="tab" id="notes-tab" role="tab" aria-selected="false" aria-controls="notes">生词本 <span class="count" id="note-count">0</span></button></div><label class="switch"><input type="checkbox" id="chinese" checked>显示中文</label></div>
<div id="reading" role="tabpanel" aria-labelledby="reading-tab"><p class="reading-hint">点右侧听原声，点单词记笔记。<button class="selected-action" id="save-selection" hidden>记所选短语</button></p><div id="sentences"></div></div>
<div id="notes" role="tabpanel" aria-labelledby="notes-tab" hidden><div id="notes-list" class="notes-list"></div></div>
<div class="footer"><span>LISTEN. READ. REMEMBER.</span><span>把词留在原来的句子里。</span></div>
</main><aside class="side"><div class="side-label">YOUR LISTENING CORNER</div><div class="art" aria-hidden="true"><i class="bar" style="height:15px"></i><i class="bar" style="height:26px"></i><i class="bar" style="height:43px"></i><i class="bar" style="height:65px"></i><i class="bar" style="height:38px"></i><i class="bar" style="height:79px"></i><i class="bar" style="height:53px"></i><i class="bar" style="height:30px"></i><i class="bar" style="height:48px"></i><i class="bar" style="height:66px"></i><i class="bar" style="height:33px"></i><i class="bar" style="height:21px"></i></div><h2>一句一句，慢慢来。</h2><p>先听一遍，再看文字。<br>读不顺的句子，就再听一次。</p><div class="steps"><div class="step"><b>01</b><span>点一句，听一句原声。</span></div><div class="step"><b>02</b><span>跟着读，找到不熟悉的表达。</span></div><div class="step"><b>03</b><span>存下释义，下次回到原句。</span></div></div><div class="source">材料来源<br><span id="source-label"></span><br><a id="source-link" target="_blank" rel="noopener noreferrer" hidden>查看原材料 ↗</a></div><p class="storage" id="storage-status">笔记保存在此浏览器。<br>换设备时，可导出备份带走。</p></aside></div>
<div class="player-wrap"><div class="player"><div class="player-buttons"><button class="round" id="previous" aria-label="上一句"><svg class="icon" viewBox="0 0 24 24"><path d="M6 5h2v14H6zm12 0v14L9 12z"/></svg></button><button class="primary-play" id="toggle-play" aria-label="播放当前句"></button><button class="round" id="next" aria-label="下一句"><svg class="icon" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM6 5l9 7-9 7z"/></svg></button><button class="round" id="replay" aria-label="重播当前句"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.3 4H3l4-5 4 5H8a4.5 4.5 0 1 0 4-1.5z"/></svg></button></div><div class="track"><div class="track-label"><span id="play-status">准备好就开始</span><span class="track-time" id="play-time"></span></div><div class="track-line"><span id="progress"></span></div></div><div class="play-options"><label><span class="small-label">语速</span><select id="speed" aria-label="播放语速"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><label><input type="checkbox" id="loop">单句循环</label><button class="mode" id="continuous" aria-pressed="false">连听</button></div></div></div>
<dialog id="note-dialog" aria-labelledby="dialog-title"><form id="note-form" class="dialog-body"><div class="dialog-top"><h2 id="dialog-title">留住这个表达</h2><button type="button" class="close" id="close-dialog" aria-label="关闭笔记">×</button></div><label class="field">词或短语<input id="expression" name="expression" required maxlength="200" autocomplete="off"></label><a class="lookup" id="dictionary" target="_blank" rel="noopener noreferrer">打开 Longman 英英词典 ↗</a><label class="field">释义 / 笔记<textarea id="definition" name="definition" required maxlength="10000" placeholder="查词后，把适合这句话的释义放在这里。"></textarea></label><div class="field">原文例句<div id="original-sentence" class="original"></div></div><label class="field">补充例句或备注（选填）<textarea id="extra" name="extra" maxlength="10000" placeholder="也可以写下自己的理解。"></textarea></label><div id="note-error" class="error" role="alert" hidden></div><div class="dialog-footer"><button type="button" class="ghost" id="cancel-note">取消</button><button type="submit" class="solid">保存笔记</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="undo" hidden>撤销</button></div>
<audio id="audio" preload="auto"></audio>
<script type="application/json" id="lesson-data">__LESSON_DATA__</script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),playIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l14-8z"/></svg>',pauseIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
let lesson=JSON.parse($('lesson-data').textContent), state,storageOK=true,index=0,token=0,frame=0,timer=0,active=false,finished=false,editor=null,lastFocus=null,dirty=false,selection=null,deleted=null,toastTimer=0;
const audio=$('audio'),defaultState=()=>({version:1,notes:[],index:0,chinese:true,speed:1,loop:false,continuous:false}), key=()=>`listening-page:v1:${lesson.id}`;
const time=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`, esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message,undo=false){clearTimeout(toastTimer);$('toast-text').textContent=message;$('undo').hidden=!undo;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,undo?8000:3500)}
function validState(candidate){if(!candidate||candidate.version!==1||!Array.isArray(candidate.notes))throw Error('备份记录格式不正确');const ids=new Set;for(const n of candidate.notes){const s=lesson.sentences.find(s=>s.id===n.sentenceId);if(!s||typeof n.id!=='string'||ids.has(n.id)||typeof n.term!=='string'||!n.term.trim()||typeof n.definition!=='string'||!n.definition.trim()||!Number.isInteger(n.start)||!Number.isInteger(n.end)||n.start<0||n.start>=n.end||n.end>s.en.length||s.en.slice(n.start,n.end).toLowerCase()!==n.term.toLowerCase())throw Error('备份中有无法对应原句的笔记');ids.add(n.id)}return {...defaultState(),...candidate,index:Math.max(0,Math.min(lesson.sentences.length-1,Number(candidate.index)||0)),speed:[.75,1,1.25,1.5].includes(candidate.speed)?candidate.speed:1,chinese:candidate.chinese!==false,loop:!!candidate.loop,continuous:!!candidate.continuous}}
function loadState(){try{const saved=localStorage.getItem(key());state=saved?validState(JSON.parse(saved)):defaultState()}catch(e){state=defaultState();storageOK=false;$('storage-status').textContent='浏览器暂时不能保存记录，请使用导出备份。';toast('本地记录无法读取。可使用备份恢复。')}}
function store(next){try{localStorage.setItem(key(),JSON.stringify(next));storageOK=true;return true}catch(e){storageOK=false;$('storage-status').textContent='浏览器暂时不能保存记录，请使用导出备份。';return false}}
function setPreference(name,value){state[name]=value;if(!store(state))toast('当前设置仅保留在此页，可导出备份。')}
function setTab(notes){$('reading').hidden=notes;$('notes').hidden=!notes;$('reading-tab').setAttribute('aria-selected',!notes);$('notes-tab').setAttribute('aria-selected',notes);if(notes)renderNotes()}
function tokenMarkup(s){let html='',at=0;const re=/[A-Za-z0-9]+(?:['’\-][A-Za-z0-9]+)*/g;for(const m of s.en.matchAll(re)){const start=m.index,end=start+m[0].length,saved=state.notes.find(n=>n.sentenceId===s.id&&n.start<end&&n.end>start);html+=esc(s.en.slice(at,start))+`<button class="word${saved?' saved':''}" data-sentence="${esc(s.id)}" data-start="${start}" data-end="${end}"${saved?' title="查看已存笔记"':''}>${esc(m[0])}</button>`;at=end}return html+esc(s.en.slice(at))}
function renderSentences(){$('sentences').innerHTML=lesson.sentences.map((s,i)=>`<article class="sentence${i===index?' active':''}" id="row-${esc(s.id)}" data-index="${i}"><span class="number">${String(i+1).padStart(2,'0')}</span><div><p class="en" data-id="${esc(s.id)}">${tokenMarkup(s)}${s.review?'<span class="review-mark">此处需核对</span>':''}</p><p class="zh"${state.chinese?'':' hidden'}>${esc(s.zh)}</p></div><button class="play-sentence" aria-label="播放第 ${i+1} 句" data-play="${i}">${i===index&&active?pauseIcon:playIcon}</button></article>`).join('');$('note-count').textContent=state.notes.length;updatePlayer()}
function renderNotes(){const rows=[...state.notes].sort((a,b)=>b.updated-a.updated);$('notes-list').innerHTML=rows.length?rows.map(n=>`<article class="note-card"><h3>${esc(n.term)}</h3><div class="definition">${esc(n.definition)}</div><p class="context">${esc(lesson.sentences.find(s=>s.id===n.sentenceId).en)}</p>${n.extra?`<div class="definition">${esc(n.extra)}</div>`:''}<div class="note-actions"><button class="ghost" data-jump="${esc(n.id)}">回到原句</button><button class="ghost" data-edit="${esc(n.id)}">编辑</button><button class="ghost" data-delete="${esc(n.id)}">删除</button></div></article>`).join(''):'<div class="empty"><div class="small-label">WORDS WITH CONTEXT</div><h2>你的第一条笔记，<br>从一句话开始。</h2><p>回到听读页，点一个不熟悉的词。<br>查到释义后，把它和原句一起留下。</p><button class="ghost" id="back-reading">去听读</button></div>'}
function highlight(){document.querySelectorAll('.sentence').forEach((el,i)=>{el.classList.toggle('active',i===index);el.querySelector('[data-play]').innerHTML=i===index&&active?pauseIcon:playIcon;el.querySelector('[data-play]').setAttribute('aria-label',`${i===index&&active?'暂停':'播放'}第 ${i+1} 句`)});updatePlayer()}
function updatePlayer(){const s=lesson.sentences[index],button=$('toggle-play');if(button.dataset.playing!==String(active)){button.innerHTML=active?pauseIcon:playIcon;button.dataset.playing=String(active);button.setAttribute('aria-label',active?'暂停当前句':'播放当前句')}const status=`第 ${index+1} / ${lesson.sentences.length} 句 · ${active?'正在播放':finished?'跟着读一遍':'点播放开始'}`,clock=`${time(Math.max(s.start,audio.currentTime||s.start))} / ${time(lesson.duration)}`;if($('play-status').textContent!==status)$('play-status').textContent=status;if($('play-time').textContent!==clock)$('play-time').textContent=clock;const fraction=Math.max(0,Math.min(1,((audio.currentTime||s.start)-s.start)/(s.end-s.start)));$('progress').style.width=`${fraction*100}%`}
function stop(){token++;clearTimeout(timer);cancelAnimationFrame(frame);audio.pause();active=false;highlight()}
function choose(i,scroll=false){stop();index=Math.max(0,Math.min(lesson.sentences.length-1,i));finished=false;state.index=index;store(state);audio.currentTime=lesson.sentences[index].start;highlight();if(scroll){setTab(false);$('row-'+lesson.sentences[index].id).scrollIntoView({block:'center',behavior:'smooth'})}}
async function play(restart=true){const my=++token;clearTimeout(timer);cancelAnimationFrame(frame);audio.pause();const s=lesson.sentences[index];if(restart||audio.currentTime<s.start||audio.currentTime>=s.end-.04)audio.currentTime=s.start;audio.playbackRate=state.speed;active=true;finished=false;highlight();try{await audio.play();if(my!==token)return;tick(my)}catch(e){if(my!==token)return;active=false;highlight();toast('音频暂时无法播放，请重试。')}}
function tick(my){if(my!==token||!active)return;const s=lesson.sentences[index];updatePlayer();if(audio.currentTime>=s.end-.02||audio.ended){audio.pause();active=false;finished=true;highlight();if(state.loop||state.continuous){timer=setTimeout(()=>{if(my!==token)return;if(state.loop){play(true)}else if(index<lesson.sentences.length-1){choose(index+1,true);play(true)}},1000)}return}frame=requestAnimationFrame(()=>tick(my))}
function toggle(){if(active){stop()}else{play(false)}}
function openEditor(s,start,end,note=null){stop();lastFocus=document.activeElement;editor={s,start,end,note};dirty=false;$('expression').value=note?note.term:s.en.slice(start,end);$('definition').value=note?note.definition:'';$('extra').value=note?note.extra||'':'';$('original-sentence').textContent=s.en;$('dialog-title').textContent=note?'回看这条笔记':'留住这个表达';$('note-error').hidden=true;lookup();$('note-dialog').showModal();$('definition').focus()}
function lookup(){$('dictionary').href='https://www.ldoceonline.com/search/?q='+encodeURIComponent($('expression').value.trim())}
function closeEditor(force=false){if(!force&&dirty&&!confirm('这条笔记还没保存。放弃修改并关闭？'))return;$('note-dialog').close();editor=null;dirty=false;if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function noteError(message){$('note-error').textContent=message;$('note-error').hidden=false}
$('note-form').addEventListener('submit',e=>{e.preventDefault();const term=$('expression').value.trim(),definition=$('definition').value.trim();if(!term||!definition){noteError('请填写词或短语，以及对应释义。');return}const original=editor.s.en;let start=editor.start;if(original.slice(start,start+term.length).toLowerCase()!==term.toLowerCase()){start=original.toLowerCase().indexOf(term.toLowerCase());if(start<0){noteError('请选取原句中实际出现的词或短语。');return}}const end=start+term.length,id=`${editor.s.id}:${start}:${end}`,existing=state.notes.find(n=>n.id===id),note={id,sentenceId:editor.s.id,start,end,term:original.slice(start,end),definition,extra:$('extra').value.trim(),updated:Date.now(),created:existing?.created||Date.now()};const notes=state.notes.filter(n=>n.id!==id&&n.id!==editor.note?.id);notes.push(note);const next={...state,notes};state=next;const ok=store(next);if(!ok){noteError('浏览器保存失败。内容已留在此页，请重试保存或导出备份。');renderSentences();renderNotes();return}closeEditor(true);renderSentences();renderNotes();toast('已保存，回到原句就能查看。')});
$('note-form').addEventListener('input',()=>{dirty=true;lookup()});$('close-dialog').onclick=()=>closeEditor();$('cancel-note').onclick=()=>closeEditor();$('note-dialog').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});
$('sentences').addEventListener('click',e=>{const btn=e.target.closest('[data-play]');if(btn){const i=Number(btn.dataset.play);if(i===index&&active)stop();else{if(i!==index)choose(i);play(false)}return}const word=e.target.closest('.word');if(!word||window.getSelection()?.toString().trim())return;const s=lesson.sentences.find(s=>s.id===word.dataset.sentence),start=Number(word.dataset.start),end=Number(word.dataset.end),note=state.notes.find(n=>n.sentenceId===s.id&&n.start<end&&n.end>start);openEditor(s,start,end,note||null)});
document.addEventListener('selectionchange',()=>{const sel=window.getSelection();if(!sel||sel.isCollapsed){$('save-selection').hidden=true;selection=null;return}const range=sel.getRangeAt(0),node=range.commonAncestorContainer,el=node.nodeType===1?node:node.parentElement,p=el.closest('.en');if(!p){$('save-selection').hidden=true;return}const s=lesson.sentences.find(s=>s.id===p.dataset.id),before=range.cloneRange();before.selectNodeContents(p);before.setEnd(range.startContainer,range.startOffset);const selected=sel.toString(),start=before.toString().length,end=start+selected.length;if(!s||end>s.en.length||!selected.trim())return;const leading=selected.length-selected.trimStart().length;selection={s,start:start+leading,end:end-(selected.length-selected.trimEnd().length)};$('save-selection').hidden=false});
$('save-selection').addEventListener('mousedown',e=>e.preventDefault());$('save-selection').onclick=()=>{if(selection){const saved=selection;window.getSelection().removeAllRanges();openEditor(saved.s,saved.start,saved.end)}};
$('notes-list').addEventListener('click',e=>{if(e.target.id==='back-reading'){setTab(false);return}const btn=e.target.closest('button');if(!btn)return;const id=btn.dataset.jump||btn.dataset.edit||btn.dataset.delete,note=state.notes.find(n=>n.id===id);if(!note)return;const s=lesson.sentences.find(s=>s.id===note.sentenceId);if(btn.dataset.jump){choose(lesson.sentences.indexOf(s),true)}else if(btn.dataset.edit){openEditor(s,note.start,note.end,note)}else{const next={...state,notes:state.notes.filter(n=>n.id!==id)};if(!store(next)){toast('删除未能保存，请重试。');return}deleted=note;state=next;renderNotes();renderSentences();toast('已删除笔记',true)}});
$('undo').onclick=()=>{if(deleted){const next={...state,notes:[...state.notes.filter(n=>n.id!==deleted.id),deleted]};if(!store(next)){toast('撤销未能保存，请重试。');return}state=next;deleted=null;renderSentences();renderNotes();toast('笔记已恢复')}};
$('reading-tab').onclick=()=>setTab(false);$('notes-tab').onclick=()=>setTab(true);$('chinese').onchange=e=>{setPreference('chinese',e.target.checked);document.querySelectorAll('.zh').forEach(el=>el.hidden=!state.chinese)};$('speed').onchange=e=>{setPreference('speed',Number(e.target.value));audio.playbackRate=state.speed};$('loop').onchange=e=>{clearTimeout(timer);setPreference('loop',e.target.checked)};$('continuous').onclick=()=>{clearTimeout(timer);setPreference('continuous',!state.continuous);$('continuous').setAttribute('aria-pressed',state.continuous);toast(state.continuous?'连听已开启，每句后留一秒停顿。':'已回到逐句听读。')};$('toggle-play').onclick=toggle;$('replay').onclick=()=>play(true);$('previous').onclick=()=>{choose(index-1,true);play(true)};$('next').onclick=()=>{choose(index+1,true);play(true)};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!$('note-dialog').open&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();toggle()}});
function download(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=()=>{download({kind:'listening-page-backup',version:1,lesson,state},'听读手记-完整备份.json');toast('备份包含原声、文本和笔记。')};$('import').onclick=()=>{stop();$('backup-file').click()};
function validateLesson(candidate){if(!candidate||candidate.version!==1||typeof candidate.id!=='string'||!candidate.id||typeof candidate.title!=='string'||!candidate.title.trim()||!Array.isArray(candidate.sentences)||!candidate.sentences.length||!Number.isFinite(candidate.duration)||candidate.duration<=0)throw Error('备份材料格式不正确');if(!candidate.audio||!['audio/mpeg','audio/wav','audio/mp4','audio/ogg'].includes(candidate.audio.mime)||typeof candidate.audio.base64!=='string'||!candidate.audio.base64||!/^[A-Za-z0-9+/]+={0,2}$/.test(candidate.audio.base64))throw Error('备份缺少有效音频');let last=0;const ids=new Set;for(const s of candidate.sentences){if(typeof s.id!=='string'||!s.id||ids.has(s.id)||typeof s.en!=='string'||!s.en.trim()||typeof s.zh!=='string'||!s.zh.trim()||!Number.isFinite(s.start)||!Number.isFinite(s.end)||s.start<last-.001||s.start<0||s.end<=s.start||s.end>candidate.duration+.05)throw Error('备份句子无法与音频对应');ids.add(s.id);last=s.end}return candidate}
$('backup-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;const oldLesson=lesson;try{if(file.size>90*1024*1024)throw Error('备份超过 90 MB');const pack=JSON.parse(await file.text());if(pack.kind!=='listening-page-backup'||pack.version!==1)throw Error('请选择听读手记的完整备份');const nextLesson=validateLesson(pack.lesson);if(nextLesson.id!==lesson.id)throw Error('这是另一份材料的备份，请在对应学习网页内恢复');lesson=nextLesson;const imported=validState(pack.state);let previous=null;try{const saved=localStorage.getItem(key());if(saved)previous=validState(JSON.parse(saved))}catch{}const merged=new Map;for(const n of [...(previous?.notes||[]),...imported.notes]){const prior=merged.get(n.id);if(!prior||n.updated>=prior.updated)merged.set(n.id,n)}const next={...imported,notes:[...merged.values()]};if(!store(next))throw Error('浏览器未能保存恢复结果');state=next;init(false);toast('已恢复原声和笔记，同位置的笔记保留较新版本。')}catch(err){lesson=oldLesson;toast('未恢复：'+err.message)}finally{e.target.value=''}};
function init(load=true){if(load)loadState();index=state.index;finished=false;active=false;audio.src=`data:${lesson.audio.mime};base64,${lesson.audio.base64}`;audio.playbackRate=state.speed;document.title=lesson.title+' · 听读手记';$('lesson-title').textContent=lesson.title;$('lesson-subtitle').textContent=lesson.subtitle||'逐句听原声，把词留在语境里。';$('duration').textContent=time(lesson.duration)+' 分钟';$('sentence-count').textContent=lesson.sentences.length+' 个句子';$('source-label').textContent=lesson.source||'你提供的音频';let href=null;try{const url=new URL(lesson.sourceUrl);if(['https:','http:'].includes(url.protocol))href=url.href}catch{}$('source-link').hidden=!href;if(href)$('source-link').href=href;$('chinese').checked=state.chinese;$('speed').value=state.speed;$('loop').checked=state.loop;$('continuous').setAttribute('aria-pressed',state.continuous);renderSentences();renderNotes();setTab(false)}
audio.addEventListener('error',()=>{stop();toast('音频无法读取，请重新生成网页或恢复完整备份。')});audio.addEventListener('loadedmetadata',()=>{audio.currentTime=lesson.sentences[index].start;updatePlayer()});window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});init();
})();
</script>
</body></html>
