<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bella Music MV Studio</title>
<style>
html,body { margin:0; background:#1b1820; color:#eee; font:13px system-ui,sans-serif; }
main { padding:12px; display:grid; gap:8px; }
#out { width:min(100%,1280px); height:auto; background:#F3EBDC; }
.p5Canvas { display:none !important; }
.bar { display:flex; gap:10px; align-items:center; max-width:1280px; }
#scrub { flex:1; } #tt { font-variant-numeric:tabular-nums; min-width:190px; }
</style>
<!-- npm ci supplies both dependencies locally. No CDN, font, audio or other remote request is required. -->
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main><canvas id="out" width="1920" height="1080"></canvas>
<div class="bar"><input id="scrub" type="range" min="0" max="15" step="0.0416666667" value="0"><span id="tt">loading…</span></div></main>
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<script src="src/sheets.js"></script>
<script src="src/lyrics.js"></script>
<script src="src/mv.js"></script>
<script>
// Explicitly separate the upstream example from a user's deliverable.
const mvQuery = new URLSearchParams(location.search);
window.MV_EXAMPLE = mvQuery.get('example') === 'demo';
const sceneScript = document.createElement('script');
sceneScript.src = window.MV_EXAMPLE ? 'examples/demo.js' : 'src/scenes/video.js';
document.write(sceneScript.outerHTML);
</script>
<script>
const loopName = new URLSearchParams(location.search).get('loop');
if (loopName && LOOPS[loopName]) window.LOOP = LOOPS[loopName];
</script>
</body></html>
